version: '3.8'

services:
  mhzaly-platform:
    build: .
    container_name: mhzaly-enterprise-security-platform
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    volumes:
      - ./data:/app/data
      - ./.streamlit:/app/.streamlit
    networks:
      - mhzaly-net

networks:
  mhzaly-net:
    driver: bridge
